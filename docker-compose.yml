services:
  sip-service:
    build: ./sip-service
    container_name: sip_phone
    ports:
      - "8000:8000"  # Para poder ver el estado desde tu navegador o curl y realizar llamadas
    environment:
      - WS_URL=ws://backend:8000/ws/audio # La dirección del cerebro
    restart: always

  backend:
    build: ./backend
    container_name: brain_backend
    ports:
      - "5000:8000" # Exponemos el cerebro en el 5000 de tu PC
    volumes:
      - ./backend:/app            # Para desarrollo (hot reload)
      #- ./data:/app/data          # Para leer CSVs
      - whisper_cache:/root/.cache/whisper # Para no descargar el modelo cada vez
    environment:
      - TZ=America/Lima
      #- OLLAMA_URL=http://ollama:11434
      - VLLM_URL=http://172.17.0.1:8100
      - VLLM_MODEL=qwen3.5-2b
      - TTS_URL=http://gemini-tts:5003
      - TTS_BACKEND=xtts
      - XTTS_URL=http://xtts:8020
      - SIP_URL=http://sip-service:8000
      #- DB_TYPE=csv  # Cambiaremos a 'mssql' cuando estés listo
      #- DB_CONNECTION_STRING=mssql+pyodbc://user:pass@host/db
      - WHISPER_DEVICE=cuda
      - WHISPER_MODEL=small
      # true para usar faster-whisper y false para usar openai-whisper
      - USE_FASTER_WHISPER=true

      - SQLSERVER_HOST=${SQLSERVER_HOST}
      - SQLSERVER_PORT=${SQLSERVER_PORT}
      - SQLSERVER_DB=${SQLSERVER_DBNAME}
      - SQLSERVER_USER=${SQLSERVER_USER}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
      
      # NUEVO: PostgreSQL
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=telefonista
      - POSTGRES_USER=telefonista
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-telefonista123}
    depends_on:
      - sip-service
      #- ollama
      #- gemini-tts
      - xtts
      - postgres
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  # gemini-tts:
  #   build: ./gemini-tts  # ⚠️ AJUSTA ESTA RUTA si moviste la carpeta gemini-tts dentro de TELE
  #   # Si gemini-tts está dentro de TELE, usa: build: ./gemini-tts
  #   container_name: gemini_tts_app
  #   ports:
  #     - "5003:5003"
  #   volumes:
  #     # Asegúrate que la ruta al JSON sea correcta en tu estructura nueva
  #     - ./gemini-tts/gemini-tts.json:/app/gemini-tts.json
  #   environment:
  #     - GOOGLE_APPLICATION_CREDENTIALS=/app/gemini-tts.json
  #   restart: always

  xtts:
    build: ./xtts-service
    container_name: xtts_server
    ports:
      - "8020:8020"
    volumes:
      - ./xtts-service/models:/xtts_models
      - ./xtts-service/output:/output
      - ./xtts-service/speakers:/speakers
    environment:
      - COQUI_TOS_AGREED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_KEEP_ALIVE=-1
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

  postgres:
    image: postgres:15-alpine
    container_name: telefonista_db
    restart: unless-stopped
    environment:
      - TZ=America/Lima
      - PGTZ=America/Lima
      - POSTGRES_DB=telefonista
      - POSTGRES_USER=telefonista
      - POSTGRES_PASSWORD=telefonista123
    volumes:
      - ./database/data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telefonista -d telefonista"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build: ./backend
    container_name: telefonista_scheduler
    command: ["sh", "-c", "echo 'Esperando 2 min para iniciar...' && sleep 120 && python scheduler.py"]
    volumes:
      - ./xtts-service/output:/output # Para limpiar audios antiguos
    environment:
      - TZ=America/Lima
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=telefonista
      - POSTGRES_USER=telefonista
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-telefonista123}
      - SQLSERVER_HOST=${SQLSERVER_HOST}
      - SQLSERVER_PORT=${SQLSERVER_PORT}
      - SQLSERVER_DB=${SQLSERVER_DBNAME}
      - SQLSERVER_USER=${SQLSERVER_USER}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
      - BACKEND_URL=http://backend:8000
    depends_on:
      - postgres
      - backend
    restart: always

volumes:
  ollama_data:
  whisper_cache: