  cosyvoice:                   # TTS ACTIVO — CosyVoice3
    build:
      context: ./cosyvoice-service
      dockerfile: Dockerfile
    image: cosyvoice3-service:local
    container_name: cosyvoice_tts
    ports:
      - "8030:8030"
    volumes:
      - ./cosyvoice-service/voices:/app/voices   # selector de voces (suelta <nombre>.wav+.txt y reinicia)
      - cosyvoice_models:/models                 # modelo ~8.5GB + spk2info.pt (persiste, no se re-descarga)
      - cosyvoice_modelscope:/root/.cache/modelscope  # FST de wetext (~15MB) para no re-descargar en cada arranque
    environment:
      - DEFAULT_VOICE=salesland
      - COSYVOICE_SPEED=1.0
      - TEXT_FRONTEND=0          # 0 = números en español nativo
      - WARMUP=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: telefonista_db
    restart: unless-stopped
    environment:
      - TZ=America/Lima
      - PGTZ=America/Lima
      - POSTGRES_DB=telefonista
      - POSTGRES_USER=telefonista
      - POSTGRES_PASSWORD=telefonista123
    volumes:
      - ./database/data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telefonista -d telefonista"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build: ./backend
    container_name: telefonista_scheduler
    command: ["sh", "-c", "echo 'Esperando 2 min para iniciar...' && sleep 120 && python scheduler.py"]
    volumes:
      - ./xtts-service/output:/output # Para limpiar audios antiguos
    environment:
      - TZ=America/Lima
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=telefonista
      - POSTGRES_USER=telefonista
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-telefonista123}
      - SQLSERVER_HOST=${SQLSERVER_HOST}
      - SQLSERVER_PORT=${SQLSERVER_PORT}
      - SQLSERVER_DB=${SQLSERVER_DBNAME}
      - SQLSERVER_USER=${SQLSERVER_USER}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
      - BACKEND_URL=http://backend:8000
    depends_on:
      - postgres
      - backend
    restart: always

volumes:
  ollama_data:
  whisper_cache:
  torch_hub_cache:   # Silero VAD (torch.hub) — evita re-descargar el zipball en cada arranque
  cosyvoice_models:
    # Reutiliza el volumen donde ya se descargó el modelo (cero re-descarga).
    # En un clon nuevo, Docker lo auto-crea y el servicio baja el modelo en el 1er arranque.
    name: cosyvoice-service_cosyvoice_models
  cosyvoice_modelscope: