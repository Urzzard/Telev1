services:
  xtts-service:
    build: .
    container_name: xtts_server_rtx5080
    restart: unless-stopped
    ports:
      - "8020:8020"
    volumes:
      - ./xtts_models:/app/models
      - ./xtts_output:/app/output
      - ./xtts_models/speakers:/speakers
    environment:
      # Aceptamos términos y forzamos configuración de NVIDIA
      - COQUI_TOS_AGREED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]